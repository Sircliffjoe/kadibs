databases:
  - name: kadibs-db
    databaseName: kadibs
    user: kadibs
    plan: free

services:
  - type: web
    name: kadibs
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: bundle exec rails server -p $PORT -e production
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kadibs-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
